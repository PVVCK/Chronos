<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedules - Chronos</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        button { cursor: pointer; margin: 2px; }
        form label { display: block; margin: 8px 0; }
        #editModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); }
        #editModalContent { background:#fff; padding:20px; margin:50px auto; width:400px; border-radius:5px; }
    </style>
</head>
<body>
<header>
    <h1>Schedules</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="executions.html">Executions</a>
        <a href="retryPolicies.html">Retry Policies</a>
    </nav>
</header>
<main>

    <!-- Create Schedule Form -->
    <section id="schedule-form">
        <h2>Create Schedule</h2>
        <form id="createScheduleForm">
            <label>Job ID: <input type="text" name="jobId" required></label>
            <label>Type: <div id="scheduleTypeContainer"></div></label>
            <label>Cron Expr: <input type="text" name="cronExpr"></label>
            <label>Interval Sec: <input type="number" name="intervalSec"></label>
            <label>Start At: <input type="datetime-local" name="startAt"></label>
            <label>End At: <input type="datetime-local" name="endAt"></label>
            <label>Timezone: <input type="text" name="timezone"></label>
            <label>Misfire Policy: <div id="misfirePolicyContainer"></div></label>
            <label>Enabled: <input type="checkbox" name="enabled"></label>
            <button type="submit">Create</button>
        </form>
    </section>

    <!-- Schedules Table -->
    <section id="schedule-list">
        <h2>All Schedules</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Job ID</th>
                <th>Type</th>
                <th>Cron</th>
                <th>Interval</th>
                <th>Start At</th>
                <th>End At</th>
                <th>Enabled</th>
                <th>Misfire Policy</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="schedulesTableBody"></tbody>
        </table>
    </section>

    <!-- Edit Modal -->
    <div id="editModal">
        <div id="editModalContent">
            <h3>Edit Schedule</h3>
            <form id="editScheduleForm">
                <input type="hidden" name="id">
                <label>Type: <div id="editScheduleTypeContainer"></div></label>
                <label>Cron Expr: <input type="text" name="cronExpr"></label>
                <label>Interval Sec: <input type="number" name="intervalSec"></label>
                <label>Start At: <input type="datetime-local" name="startAt"></label>
                <label>End At: <input type="datetime-local" name="endAt"></label>
                <label>Timezone: <input type="text" name="timezone"></label>
                <label>Misfire Policy: <div id="editMisfirePolicyContainer"></div></label>
                <label>Enabled: <input type="checkbox" name="enabled"></label>
                <button type="submit">Update</button>
                <button type="button" id="closeModalBtn">Cancel</button>
            </form>
        </div>
    </div>

</main>
<script src="js/schedules.js"></script>
</body>
</html>
